spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.hibernate.SQL=DEBUG

# Simply having flyway-core on the classpath makes Boot auto-configure a single-schema
# migration that runs at every context start. These tests are not testing that, and it
# would try to migrate the shared fixture schema. A real user of the per-tenant runner
# needs the same setting, for the same reason — see docs/migrations.md.
spring.flyway.enabled=false
