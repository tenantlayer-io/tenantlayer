# Points the service at the persistent demo database (docker container tl-orders-pg).
# Activate with: --spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:55433/orders
spring.datasource.username=orders_app
spring.datasource.password=orders_pwd

server.port=8080

# Feature 6 — ordered chain. Header first, then /t/{tenant}/... path form.
tenantlayer.resolvers=header,path
tenantlayer.path-prefix=/t

# Feature 83 — the tenant on every log line, from the MDC.
logging.pattern.level=%5p [tenant=%X{tenant:-none}]
