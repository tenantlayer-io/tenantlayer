# The secured shape: the tenant comes from the token, and the caller's right to it is
# checked. The header resolver is kept as a fallback purely to demonstrate that it can no
# longer be used to reach another tenant — membership verification rejects it.
orders.security.enabled=true

tenantlayer.resolvers=JWT,HEADER
tenantlayer.jwt-claim=tenant_id
tenantlayer.membership.enabled=true
tenantlayer.membership.claim=tenants
