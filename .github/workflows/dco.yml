name: DCO

# Every commit must carry a Signed-off-by line. See DCO.md.
#
# A workflow rather than a third-party app: it is twenty lines, it has no access to
# anything, and it cannot stop working because someone else's service changed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full range of the PR, not just the tip.
          fetch-depth: 0

      - name: Check every commit for Signed-off-by
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          missing=0

          while read -r sha; do
            [ -z "$sha" ] && continue
            # Merge commits are generated by GitHub and cannot be signed off.
            if [ "$(git rev-list --no-walk --count --merges "$sha")" = "1" ]; then
              continue
            fi
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "  ok       $(git log -1 --format='%h %s' "$sha")"
            else
              echo "  MISSING  $(git log -1 --format='%h %s' "$sha")   ($author)"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE".."$HEAD")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "::error::$missing commit(s) are missing a Signed-off-by line. See DCO.md."
            echo ""
            echo "Signing off certifies you have the right to submit the code."
            echo "It is one line, added automatically by: git commit -s"
            echo ""
            echo "To fix commits you have already made:"
            echo "    git rebase --signoff origin/main"
            echo "    git push --force-with-lease"
            echo ""
            exit 1
          fi

          echo "All commits signed off."
