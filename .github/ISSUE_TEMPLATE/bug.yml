name: Bug
description: Something is broken that is not an isolation failure
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: TenantLayer version
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Spring Boot / Hibernate / Java versions
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
